apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clouddental-ingress
  namespace: clouddental
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Enable sticky sessions for Blazor Server
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
spec:
  tls:
  - hosts:
    - clouddentaloffice.com
    - www.clouddentaloffice.com
    secretName: clouddental-tls
  rules:
  - host: clouddentaloffice.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clouddental-portal-svc
            port:
              number: 80
  - host: www.clouddentaloffice.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clouddental-portal-svc
            port:
              number: 80
